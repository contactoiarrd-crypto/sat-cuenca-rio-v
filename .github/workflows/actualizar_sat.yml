name: Actualización Automática SAT Cuenca Río V

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar-sat:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests beautifulsoup4 pandas numpy openpyxl urllib3

      - name: Ejecutar script unificado SAT
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python sat_unificado_hidro_meteo.py

      - name: Confirmar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No se registraron cambios nuevos en los datos."
          else
            git commit -m "Auto-actualización datos SAT Cuenca Río V [skip ci]"
            git push origin main || git push
          fi
