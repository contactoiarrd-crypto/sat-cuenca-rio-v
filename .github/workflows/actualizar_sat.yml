name: Actualizar SAT Rio V en Tiempo Real

on:
  schedule:
    - cron: '*/10 * * * *'  # Corre automáticamente cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests beautifulsoup4 openpyxl
          fi

      - name: Ejecutar Extractor y Generador
        run: |
          python sat_unificado_hidro_meteo.py

      - name: Publicar cambios en GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Elimina el mapa viejo para que no sobreescriba ni cause conflicto
          git rm -f mapa_sat_rio_v_triprovincial.html 2>/dev/null || true
          
          # Agrega el index.html generado directamente por el script y los reportes
          git add index.html sat_unificado_rio_v_triprovincial.xlsx resumen_cruce_rio_v_triprovincial.csv
          
          # Commit y push sin [skip ci] para disparar el deployment de GitHub Pages
          if ! git diff --staged --quiet; then
            git commit -m "Auto-actualizacion SAT Rio V [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main || true
            git push origin main
          fi
