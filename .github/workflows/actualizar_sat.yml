name: Actualizar SAT Cuenca Rio V

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sat:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install requests pandas numpy folium openpyxl beautifulsoup4 urllib3

      - name: Ejecutar Pipeline
        run: |
          python sat_unificado_hidro_meteo.py

      - name: Publicar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html sat_unificado_rio_v_triprovincial.xlsx resumen_cruce_rio_v_triprovincial.csv
          git commit -m "Auto-actualización SAT Río V - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
